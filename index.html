<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brooks Mershon</title>
<meta name="description" content="Brooks Mershon. Aerobatics, jets, and software engineering.">
<meta property="og:title" content="Brooks Mershon">
<meta property="og:image" content="https://www.brooksmershon.com/img/me/brooks_mershon_social_card.png">
<link rel="preload" as="image" href="img/me/sukhoi_landing.jpg">
<style>
  :root {
    --ink: rgba(10, 12, 18, 0.88);
    --ink-soft: rgba(10, 12, 18, 0.7);
    --accent: #8c1a2e; /* the Sukhoi's red */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    /* matches the haze on the photo's edge so the fade is seamless */
    background: linear-gradient(#c3b7b9 0%, #beafb2 17%, #b2a7af 33%, #a3a2aa 50%, #9d9ca4 67%, #95939e 83%, #8b8b95 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* Background photo */
  .bg {
    position: fixed;
    inset: 0 0 0 auto;
    width: 68vw;
    height: 100vh;
    z-index: -1;
    background: url("img/me/sukhoi_landing.jpg") center 46% / cover no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%);
            mask-image: linear-gradient(to right, transparent 0%, #000 30%);
  }

  main {
    padding: clamp(24px, 4vw, 56px);
    max-width: 980px;
  }

  .intro {
    font-size: clamp(12px, 4.1vw, 28px);
    white-space: nowrap;
    line-height: 1.3;
    font-weight: 300;
    margin-bottom: clamp(36px, 5vw, 64px);
  }
  .intro strong { font-weight: 700; }
  .nw { white-space: nowrap; }

  nav ul { list-style: none; }
  nav a {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    font-size: clamp(34px, 4.6vw, 60px);
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); transform: translateX(4px); outline: none; }
  nav svg {
    width: 0.8em;
    height: 0.8em;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Phones / portrait: photo fills the screen, text sits in the sky */
  @media (max-aspect-ratio: 1/1) {
    body { background: #c9bfc3; }
    .bg {
      width: 100vw;
      background-size: auto 112%;
      background-position: 45% 70px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 70px, #000 180px);
              mask-image: linear-gradient(to bottom, transparent 70px, #000 180px);
    }
  }
</style>
</head>
<body>
<div class="bg" role="img" aria-label="Brooks's Sukhoi SU-26M in a knife-edge pass above hazy mountains"></div>

<main>
  <p class="intro">I’m <strong>Brooks Mershon</strong>.<br>
    Aerobatics, jets, and software engineering.<br>
    <strong>KVBT + KSZP</strong></p>

  <nav>
    <ul>
      <li><a href="https://www.instagram.com/brooks_mershon/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
        Instagram</a></li>
      <li><a href="https://www.flickr.com/photos/brooksmershon/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><circle cx="12" cy="13" r="4"/></svg>
        Photos</a></li>
      <li><a href="https://www.youtube.com/user/BrooksMershon/featured">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>
        Videos</a></li>
      <li><a href="https://github.com/bmershon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M1 20h22"/><path d="M9.5 8l-2.5 2.25 2.5 2.25M14.5 8l2.5 2.25-2.5 2.25"/></svg>
        GitHub</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
